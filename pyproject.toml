[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stpt"
version = "0.0.1"
description = "Stigmergic Phase Transitions (revision 3): memoryless LLM agents on a degree-4 vote board"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0", "numpy", "scipy", "pandas", "networkx==3.7",
  # the shared pipeline, pinned by COMMIT (pins.yaml); installs once v1.2.0 is pushed to GitHub
  "sae-ethos-pipeline @ git+https://github.com/RandallSPQR/SAE-Ethos-Calibration@5ca15f56a71f35d5818d0392f7f3b4acb2d85d1b",
]

[tool.setuptools]
packages = ["stpt"]
